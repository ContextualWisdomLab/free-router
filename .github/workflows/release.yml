name: Release

on:
  push:
    tags:
      - "cli-v*"
      - "site-v*"
      - "v*"

permissions:
  contents: read

jobs:
  publish-cli:
    name: Publish CLI (npm)
    if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'cli-v') || (startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'site-v')))
    runs-on: ubuntu-latest
    environment:
      name: npm-release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REF_PROTECTED: ${{ github.ref_protected }}
    permissions:
      contents: write
    steps:
      - name: Validate protected release tag
        run: |
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "::error::Release tags must be protected by repository rulesets before release credentials are exposed."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^(cli-v|v)[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be vX.Y.Z or cli-vX.Y.Z."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Verify tag matches root package.json version
        run: |
          PKG_VERSION_LEGACY="v$(node -p "require('./package.json').version")"
          PKG_VERSION_TARGETED="cli-v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$PKG_VERSION_LEGACY" ] && [ "$RELEASE_TAG" != "$PKG_VERSION_TARGETED" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version ($PKG_VERSION_LEGACY or $PKG_VERSION_TARGETED)"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build dist artifacts
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  release-site:
    name: Release site artifact
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'site-v')
    runs-on: ubuntu-latest
    environment:
      name: site-release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REF_PROTECTED: ${{ github.ref_protected }}
    permissions:
      contents: write
    steps:
      - name: Validate protected release tag
        run: |
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "::error::Release tags must be protected by repository rulesets before release credentials are exposed."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^site-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be site-vX.Y.Z."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Verify tag matches site/package.json version
        run: |
          SITE_VERSION="site-v$(node -p "require('./site/package.json').version")"
          if [ "$SITE_VERSION" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match site/package.json version $SITE_VERSION"
            exit 1
          fi

      - name: Install site dependencies
        run: bun install --cwd site --frozen-lockfile

      - name: Build site
        run: bun run --cwd site build

      - name: Package site artifact
        run: tar -C site/dist -czf site-dist.tgz .

      - name: Create GitHub release
        run: |
          gh release create "$RELEASE_TAG" site-dist.tgz \
            --title "$RELEASE_TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
